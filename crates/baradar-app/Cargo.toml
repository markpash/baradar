[package]
name = "baradar-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "baradar label studio (GPUI desktop app)"

[[bin]]
name = "baradar-app"
path = "src/main.rs"

[dependencies]
baradar-core = { workspace = true }
baradar-printer = { workspace = true }
ptouch = { workspace = true }
ptouch-transport = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
async-channel = "2.5"
ureq = "3"
sha2 = "0.10"
gpui-kit = "=0.7.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
