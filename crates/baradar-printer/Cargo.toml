[package]
name = "baradar-printer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Printer connection, Bluetooth scanning and pairing for baradar"

[dependencies]
ptouch = { workspace = true }
ptouch-transport = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# Client <-> UI channels: async receivers for GPUI tasks, blocking sends from the client thread.
async-channel = "2.5"

# Bluetooth pairing (src/bluetooth.rs). Same versions as ptouch-transport uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-io-bluetooth = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "Bluetooth", "IOBluetoothObject", "IOBluetoothDevice", "IOBluetoothDevicePair"] }
